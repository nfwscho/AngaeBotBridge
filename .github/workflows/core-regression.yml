# 앙개봇 Python Core 전체 기능 보존 회귀 검사
# 1. 기존 계산·시간·AI·시세·그룹·메뉴·로그 동작의 unittest를 자동 실행한다.
# 2. Python 3.12에서 문법을 확인하고 모든 core/tests 테스트를 수행한다.
# 3. S20+ Termux 서비스와 데이터베이스는 건드리지 않는다.
# 4. 기능 브랜치와 main에 커밋될 때 자동 실행하여 배포 전 회귀 검사를 보장한다.
# 5. 통합 메뉴 및 단축어의 Android Kotlin 단위 테스트와 APK debug 빌드를 수행하고 결과를 보관한다.
# 6. Android ADB 탐색 보조 스크립트의 PowerShell 5.1/7 문법 및 경로 탐색 회귀 테스트를 수행한다.
# 7. 실제 ADB 다운로드/실기기 설치는 CI에서 수행하지 않으며 기존 운영 데이터에 접근하지 않는다.
name: AngaeBot Core regression
on:
  push:
    branches:
      - 'feature/**'
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python Core dependencies
        run: python -m pip install -r core/requirements.txt httpx
      - name: Validate PowerShell deploy and ADB script syntax
        shell: pwsh
        run: |
          foreach ($file in @('./deploy-angaebot.ps1', './scripts/resolve-adb.ps1', './scripts/test-resolve-adb.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Out-String | Write-Error; exit 1 }
          }
      - name: Compile all Core modules
        run: python -m compileall -q core/app
      - name: Run all Python Core regression tests
        working-directory: core
        run: python -m unittest discover -s tests -v

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell 5.1 deployment scripts
        shell: powershell
        run: |
          foreach ($file in @('./deploy-angaebot.ps1', './scripts/resolve-adb.ps1', './scripts/test-resolve-adb.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Out-String | Write-Error; exit 1 }
            $text = [System.IO.File]::ReadAllText((Resolve-Path $file))
            if (@($text.ToCharArray() | Where-Object { [int]$_ -gt 127 }).Count -gt 0) { throw "Non-ASCII characters in $file" }
          }
      - name: Test Android SDK ADB auto-discovery
        shell: powershell
        run: .\scripts\test-resolve-adb.ps1

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Run Android menu tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build Android debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: angaebot-menu-back-zero-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
